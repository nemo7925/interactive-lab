<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Interactive Lab</title>


  <style>

    /* ========================================
       기본 설정
    ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        sans-serif;

      background: #050814;

      color: white;
    }


    /* ========================================
       메인 화면
    ======================================== */

    #main {

      position: relative;

      width: 100%;

      height: 100vh;

      /* Safari 대응 */
      height: 100dvh;

      overflow: hidden;

      touch-action: manipulation;
    }


    /* ========================================
       낮 / 밤 장면
    ======================================== */

    #scene {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 0;
    }


    #scene img {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      /*
        그림 전체를 보여주기 위해 contain 사용
      */

      object-fit: contain;

      object-position: center;

      user-select: none;

      pointer-events: none;

      transition:
        opacity 1.8s ease;
    }


    /* 낮 */

    #day {

      opacity: 1;

    }


    /* 밤 */

    #night {

      opacity: 0;

    }


    /* ========================================
       제목
    ======================================== */

    #title {

      position: absolute;

      top:
        max(
          28px,
          env(safe-area-inset-top)
        );

      left: 50%;

      transform:
        translateX(-50%);

      text-align: center;

      z-index: 20;

      pointer-events: none;

      text-shadow:
        0 2px 20px
        rgba(0,0,0,0.45);
    }


    #title h1 {

      font-size: 22px;

      font-weight: 400;

      letter-spacing: 0.15em;
    }


    #title p {

      margin-top: 8px;

      font-size: 11px;

      opacity: 0.65;

      letter-spacing: 0.08em;
    }


    /* ========================================
       카테고리
    ======================================== */

    #categories {

      position: absolute;

      left: 24px;

      bottom:
        calc(
          28px +
          env(safe-area-inset-bottom)
        );

      display: flex;

      flex-direction: column;

      gap: 10px;

      z-index: 30;
    }


    .category {

      border: none;

      background: none;

      color: white;

      font-size: 12px;

      letter-spacing: 0.15em;

      opacity: 0.65;

      cursor: pointer;

      text-align: left;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }


    .category:hover {

      opacity: 1;

      transform:
        translateX(5px);
    }


    /* ========================================
       별자리
    ======================================== */

    #constellation {

      position: absolute;

      /*
        현재 임시 위치
        나중에 실제 그림에 맞춰 조정
      */

      top: 20%;

      left: 70%;

      width: 40px;

      height: 40px;

      border: none;

      border-radius: 50%;

      background: white;

      cursor: pointer;

      z-index: 25;

      box-shadow:

        0 0 8px white,

        0 0 20px
        rgba(150,200,255,0.9),

        0 0 40px
        rgba(100,160,255,0.6);

      animation:
        starPulse 3s
        ease-in-out
        infinite;
    }


    @keyframes starPulse {

      0%,
      100% {

        transform:
          scale(0.8);

        opacity: 0.65;
      }

      50% {

        transform:
          scale(1);

        opacity: 1;
      }

    }


    /* ========================================
       TEA 버튼
    ======================================== */

    #teaButton {

      position: absolute;

      right: 28px;

      bottom:
        calc(
          30px +
          env(safe-area-inset-bottom)
        );

      width: 58px;

      height: 58px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,0.35);

      background:
        rgba(255,255,255,0.12);

      color: white;

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      cursor: pointer;

      z-index: 40;

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }


    #teaButton:hover {

      transform:
        scale(1.08);

      background:
        rgba(255,255,255,0.2);
    }


    #teaButton span {

      display: block;

      font-size: 20px;
    }


    #teaButton small {

      display: block;

      margin-top: 2px;

      font-size: 7px;

      letter-spacing: 0.1em;
    }


    /* ========================================
       TEA 메뉴
    ======================================== */

    #teaMenu {

      position: absolute;

      right: 25px;

      bottom:
        calc(
          100px +
          env(safe-area-inset-bottom)
        );

      width: 180px;

      padding: 18px;

      border:
        1px solid
        rgba(255,255,255,0.2);

      border-radius: 20px;

      background:
        rgba(10,15,30,0.75);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      z-index: 50;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(15px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }


    #teaMenu.show {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateY(0);
    }


    #teaMenu h2 {

      font-size: 13px;

      font-weight: 400;

      letter-spacing: 0.15em;

      margin-bottom: 14px;
    }


    .tea {

      display: block;

      width: 100%;

      padding: 9px 0;

      border: none;

      background: none;

      color: white;

      text-align: left;

      font-size: 12px;

      opacity: 0.7;

      cursor: pointer;

      transition:
        opacity 0.2s ease;
    }


    .tea:hover {

      opacity: 1;
    }


    /* ========================================
       SECRET
    ======================================== */

    #secret {

      position: absolute;

      left: 50%;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      border: none;

      background: none;

      color: white;

      font-size: 10px;

      letter-spacing: 0.2em;

      opacity: 0.35;

      cursor: pointer;

      z-index: 35;

      transition:
        opacity 0.3s ease;
    }


    #secret:hover {

      opacity: 1;
    }


    /* ========================================
       메시지
    ======================================== */

    #message {

      position: absolute;

      top: 50%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      padding:
        14px 22px;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.12);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      z-index: 100;

      transition:
        opacity 0.5s ease;
    }


    #message.show {

      opacity: 1;
    }


    /* ========================================
       모바일
    ======================================== */

    @media (max-width: 600px) {

      #title h1 {

        font-size: 18px;
      }


      #title p {

        font-size: 10px;
      }


      #categories {

        left: 18px;

        bottom:
          calc(
            25px +
            env(safe-area-inset-bottom)
          );
      }


      #teaButton {

        right: 18px;
      }


      #constellation {

        top: 18%;

        left: 68%;

        width: 34px;

        height: 34px;
      }

    }

  </style>

</head>


<body>


  <main id="main">


    <!-- ====================================
         낮 / 밤 배경
    ===================================== -->

    <div id="scene">

      <img
        id="day"
        src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/day-test1.PNG"
        alt=""
      >

      <img
        id="night"
        src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/night-test.png"
        alt=""
      >

    </div>


    <!-- ====================================
         제목
    ===================================== -->

    <div id="title">

      <h1>INTERACTIVE LAB</h1>

      <p>
        움직이는 그림과 이야기를 만드는 공간
      </p>

    </div>


    <!-- ====================================
         별자리
    ===================================== -->

    <button
      id="constellation"
      aria-label="나의 별자리"
    ></button>


    <!-- ====================================
         카테고리
    ===================================== -->

    <nav id="categories">

      <button
        class="category"
        data-message="REST"
      >
        REST
      </button>


      <button
        class="category"
        data-message="DREAM"
      >
        DREAM
      </button>


      <button
        class="category"
        data-message="STORY"
      >
        STORY
      </button>


      <button
        class="category"
        data-message="PLAY"
      >
        PLAY
      </button>

    </nav>


    <!-- ====================================
         TEA
    ===================================== -->

    <button
      id="teaButton"
      aria-label="Tea Menu"
    >

      <span>🍵</span>

      <small>TEA</small>

    </button>


    <!-- ====================================
         TEA MENU
    ===================================== -->

    <div id="teaMenu">

      <h2>TEA MENU</h2>


      <button
        class="tea"
        data-tea="GREEN"
      >
        Green Tea
      </button>


      <button
        class="tea"
        data-tea="ROSE"
      >
        Rose Tea
      </button>


      <button
        class="tea"
        data-tea="BLACK"
      >
        Black Tea
      </button>


      <button
        class="tea"
        data-tea="NIGHT"
      >
        Night Tea
      </button>

    </div>


    <!-- ====================================
         SECRET
    ===================================== -->

    <button id="secret">
      SECRET
    </button>


    <!-- ====================================
         메시지
    ===================================== -->

    <div id="message"></div>


  </main>


  <script>


    /* ========================================
       요소 가져오기
    ======================================== */

    const dayImage =
      document.getElementById("day");


    const nightImage =
      document.getElementById("night");


    const teaButton =
      document.getElementById("teaButton");


    const teaMenu =
      document.getElementById("teaMenu");


    const constellation =
      document.getElementById("constellation");


    const secret =
      document.getElementById("secret");


    const message =
      document.getElementById("message");


    /* ========================================
       방문자 시간 확인
    ======================================== */

    function updateSceneByTime() {

      const now =
        new Date();


      /*
        방문자의 기기 현지 시간

        06:00 ~ 17:59
        → 낮

        18:00 ~ 05:59
        → 밤
      */

      const hour =
        now.getHours();


      if (
        hour >= 6 &&
        hour < 18
      ) {

        /*
          낮
        */

        dayImage.style.opacity =
          "1";

        nightImage.style.opacity =
          "0";

      }

      else {

        /*
          밤
        */

        dayImage.style.opacity =
          "0";

        nightImage.style.opacity =
          "1";

      }

    }


    /*
      페이지가 처음 열릴 때
      시간 확인
    */

    updateSceneByTime();


    /*
      페이지를 계속 켜놓은 경우

      1분마다 시간을 다시 확인
    */

    setInterval(
      updateSceneByTime,
      60000
    );


    /* ========================================
       Tea 버튼
    ======================================== */

    teaButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        teaMenu.classList.toggle(
          "show"
        );

      }
    );


    /* ========================================
       Tea 선택
    ======================================== */

    document
      .querySelectorAll(".tea")
      .forEach(
        function(tea) {

          tea.addEventListener(
            "click",
            function() {

              const teaName =
                tea.dataset.tea;


              showMessage(
                teaName +
                " TEA를 선택했어요 ☕"
              );


              teaMenu.classList.remove(
                "show"
              );

            }
          );

        }
      );


    /* ========================================
       별자리
    ======================================== */

    constellation.addEventListener(
      "click",
      function() {

        window.location.href =
          "constellation/";

      }
    );


    /* ========================================
       카테고리
    ======================================== */

    document
      .querySelectorAll(".category")
      .forEach(
        function(category) {

          category.addEventListener(
            "click",
            function() {

              showMessage(
                category.dataset.message
              );

            }
          );

        }
      );


    /* ========================================
       SECRET
    ======================================== */

    secret.addEventListener(
      "click",
      function() {

        showMessage(
          "아직 아무도 발견하지 못한 곳이에요."
        );

      }
    );


    /* ========================================
       메시지 표시
    ======================================== */

    let messageTimer;


    function showMessage(text) {

      message.textContent =
        text;


      message.classList.add(
        "show"
      );


      clearTimeout(
        messageTimer
      );


      messageTimer =
        setTimeout(
          function() {

            message.classList.remove(
              "show"
            );

          },
          1800
        );

    }


    /* ========================================
       바깥을 클릭하면 Tea 닫기
    ======================================== */

    document
      .getElementById("main")
      .addEventListener(
        "click",
        function(event) {

          if (
            !teaMenu.contains(
              event.target
            ) &&
            event.target !==
              teaButton
          ) {

            teaMenu.classList.remove(
              "show"
            );

          }

        }
      );


  </script>


</body>

</html>
