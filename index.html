<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Nemo's World</title>

  <link rel="stylesheet" href="https://nemo7925.github.io/interactive-lab/style.css">
</head>

<body>

  <main id="main">

    <!-- 낮 / 밤 배경 -->
    <div id="scene">

      <img
        id="day"
        src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/day-test1.PNG"
        alt=""
      >

      <img
        id="night"
        src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/night-test.png"
        alt=""
      >

    </div>


    <!-- 제목 -->
    <div id="title">

      <h1>NEMO'S WORLD</h1>

      <p>
        a little world of images & stories
      </p>

    </div>


    <!-- 별자리 -->
    <button
      id="constellation"
      aria-label="나의 별자리"
    ></button>


    <!-- 메뉴 -->
    <nav id="categories">

      <button
        class="category"
        data-message="REST"
      >
        REST
      </button>

      <button
        class="category"
        data-message="DREAM"
      >
        DREAM
      </button>

      <button
        class="category"
        data-message="STORY"
      >
        STORY
      </button>

      <button
        class="category"
        data-message="PLAY"
      >
        PLAY
      </button>

    </nav>


    <!-- Tea -->
    <button
      id="teaButton"
      aria-label="Tea Menu"
    >

      <span>🍵</span>

      <small>TEA</small>

    </button>


    <!-- Tea 메뉴 -->
    <div id="teaMenu">

      <h2>TEA MENU</h2>

      <button
        class="tea"
        data-tea="GREEN"
      >
        Green Tea
      </button>

      <button
        class="tea"
        data-tea="ROSE"
      >
        Rose Tea
      </button>

      <button
        class="tea"
        data-tea="BLACK"
      >
        Black Tea
      </button>

      <button
        class="tea"
        data-tea="NIGHT"
      >
        Night Tea
      </button>

    </div>


    <!-- Secret -->
    <button id="secret">
      SECRET
    </button>


    <!-- 메시지 -->
    <div id="message"></div>

  </main>


  <script src="https://nemo7925.github.io/interactive-lab/script.js"></script>

</body>

</html>
