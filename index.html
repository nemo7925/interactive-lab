<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>TEST-123456</title>

<style>

/* =========================
   기본
========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    sans-serif;

  background: #050814;
  color: white;
}


/* =========================
   메인 화면
========================= */

#main {
  position: relative;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  background: #050814;
}


/* =========================
   배경
========================= */

#scene {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  z-index: 0;
}


/* =========================
   이미지
========================= */

#scene img {

  position: absolute;

  width: 100%;
  height: 100%;

  object-fit: contain;

  object-position: center center;

  display: block;

  user-select: none;
  -webkit-user-select: none;

  pointer-events: none;

  transition:
    opacity 1.5s ease;
}


/* 낮 */

#day {
  opacity: 1;
}


/* 밤 */

#night {
  opacity: 0;
}


/* =========================
   제목
========================= */

#title {

  position: absolute;

  top:
    max(
      28px,
      env(safe-area-inset-top)
    );

  left: 50%;

  transform:
    translateX(-50%);

  width: 90%;

  text-align: center;

  z-index: 20;

  pointer-events: none;

  text-shadow:
    0 2px 20px
    rgba(0,0,0,0.45);
}


#title h1 {

  font-size: 22px;

  font-weight: 400;

  letter-spacing: 0.15em;
}


#title p {

  margin-top: 8px;

  font-size: 11px;

  letter-spacing: 0.08em;

  opacity: 0.7;
}


/* =========================
   메뉴
========================= */

#menu {

  position: absolute;

  left: 24px;

  bottom:
    calc(
      28px +
      env(safe-area-inset-bottom)
    );

  display: flex;

  flex-direction: column;

  gap: 10px;

  z-index: 30;
}


.menu-item {

  border: none;

  padding: 0;

  background: transparent;

  color: white;

  font-family: inherit;

  font-size: 12px;

  letter-spacing: 0.16em;

  text-align: left;

  opacity: 0.75;

  cursor: pointer;

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
}


.menu-item:hover {

  opacity: 1;

  transform:
    translateX(5px);
}


.menu-item:active {

  transform:
    translateX(3px)
    scale(0.97);
}


/* =========================
   별자리
========================= */

#constellation {

  position: absolute;

  top: 20%;
  left: 70%;

  width: 34px;
  height: 34px;

  padding: 0;

  border: none;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 0 8px white,
    0 0 20px
      rgba(150,200,255,0.95),
    0 0 40px
      rgba(100,160,255,0.7);

  cursor: pointer;

  z-index: 25;

  animation:
    starPulse 3s
    ease-in-out
    infinite;
}


@keyframes starPulse {

  0%,
  100% {

    transform:
      scale(0.8);

    opacity: 0.65;
  }

  50% {

    transform:
      scale(1);

    opacity: 1;
  }

}


/* =========================
   TEA 버튼
========================= */

#tea-button {

  position: absolute;

  right: 24px;

  bottom:
    calc(
      28px +
      env(safe-area-inset-bottom)
    );

  width: 58px;
  height: 58px;

  border-radius: 50%;

  border:
    1px solid
    rgba(255,255,255,0.3);

  background:
    rgba(255,255,255,0.12);

  color: white;

  font-family: inherit;

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  cursor: pointer;

  z-index: 40;

  transition:
    transform 0.25s ease,
    background 0.25s ease;
}


#tea-button:hover {

  transform:
    scale(1.08);

  background:
    rgba(255,255,255,0.2);
}


#tea-button:active {

  transform:
    scale(0.95);
}


#tea-button .cup {

  display: block;

  font-size: 20px;

  line-height: 20px;
}


#tea-button .label {

  display: block;

  margin-top: 3px;

  font-size: 7px;

  letter-spacing: 0.12em;
}


/* =========================
   TEA 메뉴
========================= */

#tea-menu {

  position: absolute;

  right: 24px;

  bottom:
    calc(
      98px +
      env(safe-area-inset-bottom)
    );

  width: 190px;

  padding: 18px;

  border:
    1px solid
    rgba(255,255,255,0.2);

  border-radius: 20px;

  background:
    rgba(8,12,25,0.78);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  z-index: 50;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transform:
    translateY(12px);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease,
    visibility 0.25s ease;
}


#tea-menu.open {

  opacity: 1;

  visibility: visible;

  pointer-events: auto;

  transform:
    translateY(0);
}


#tea-menu h2 {

  margin-bottom: 12px;

  font-size: 13px;

  font-weight: 400;

  letter-spacing: 0.16em;
}


.tea-item {

  display: block;

  width: 100%;

  padding: 9px 0;

  border: none;

  background: transparent;

  color: white;

  font-family: inherit;

  font-size: 12px;

  text-align: left;

  opacity: 0.7;

  cursor: pointer;
}


.tea-item:hover {

  opacity: 1;
}


/* =========================
   메시지
========================= */

#message {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  padding:
    13px 21px;

  border-radius: 30px;

  background:
    rgba(255,255,255,0.14);

  backdrop-filter:
    blur(15px);

  -webkit-backdrop-filter:
    blur(15px);

  color: white;

  font-size: 13px;

  white-space: nowrap;

  opacity: 0;

  pointer-events: none;

  z-index: 100;

  transition:
    opacity 0.5s ease;
}


#message.show {

  opacity: 1;
}


/* =========================
   SECRET
========================= */

#secret {

  position: absolute;

  left: 50%;

  bottom:
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  border: none;

  background: transparent;

  color: white;

  font-family: inherit;

  font-size: 9px;

  letter-spacing: 0.2em;

  opacity: 0.3;

  cursor: pointer;

  z-index: 35;
}


#secret:hover {

  opacity: 0.9;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

  #title {

    top:
      max(
        22px,
        env(safe-area-inset-top)
      );
  }


  #title h1 {

    font-size: 18px;
  }


  #title p {

    font-size: 10px;
  }


  #menu {

    left: 18px;

    bottom:
      calc(
        22px +
        env(safe-area-inset-bottom)
      );
  }


  #tea-button {

    right: 18px;

    bottom:
      calc(
        22px +
        env(safe-area-inset-bottom)
      );
  }


  #tea-menu {

    right: 18px;

    bottom:
      calc(
        92px +
        env(safe-area-inset-bottom)
      );
  }


  #constellation {

    width: 30px;
    height: 30px;

    top: 18%;
    left: 68%;
  }


  #secret {

    display: none;
  }

}


/* =========================
   가로가 짧은 화면
========================= */

@media (max-height: 600px) {

  #title h1 {

    font-size: 17px;
  }


  #title p {

    display: none;
  }


  #menu {

    gap: 7px;
  }


  #tea-button {

    width: 50px;
    height: 50px;
  }

}

</style>

</head>


<body>


<main id="main">


  <!-- =====================
       배경 이미지
  ====================== -->

  <div id="scene">

    <img
      id="day"
      src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/day-test1.PNG"
      alt=""
    >

    <img
      id="night"
      src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/night-test.png"
      alt=""
    >

  </div>


  <!-- =====================
       제목
  ====================== -->

  <header id="title">

    <h1>NEMO'S WORLD</h1>

    <p>
      a little world of images &amp; stories
    </p>

  </header>


  <!-- =====================
       별자리
  ====================== -->

  <button
    id="constellation"
    type="button"
    aria-label="나의 별자리"
  ></button>


  <!-- =====================
       메뉴
  ====================== -->

  <nav id="menu">

    <button
      class="menu-item"
      data-message="REST"
      type="button"
    >
      REST
    </button>


    <button
      class="menu-item"
      data-message="DREAM"
      type="button"
    >
      DREAM
    </button>


    <button
      class="menu-item"
      data-message="STORY"
      type="button"
    >
      STORY
    </button>


    <button
      class="menu-item"
      data-message="PLAY"
      type="button"
    >
      PLAY
    </button>

  </nav>


  <!-- =====================
       TEA
  ====================== -->

  <button
    id="tea-button"
    type="button"
    aria-label="Tea Menu"
  >

    <span class="cup">🍵</span>

    <span class="label">
      TEA
    </span>

  </button>


  <!-- =====================
       TEA MENU
  ====================== -->

  <section id="tea-menu">

    <h2>
      TEA MENU
    </h2>


    <button
      class="tea-item"
      data-tea="GREEN TEA"
      type="button"
    >
      Green Tea
    </button>


    <button
      class="tea-item"
      data-tea="ROSE TEA"
      type="button"
    >
      Rose Tea
    </button>


    <button
      class="tea-item"
      data-tea="BLACK TEA"
      type="button"
    >
      Black Tea
    </button>


    <button
      class="tea-item"
      data-tea="NIGHT TEA"
      type="button"
    >
      Night Tea
    </button>

  </section>


  <!-- =====================
       SECRET
  ====================== -->

  <button
    id="secret"
    type="button"
  >
    SECRET
  </button>


  <!-- =====================
       메시지
  ====================== -->

  <div id="message"></div>


</main>


<script>

/* =========================
   요소
========================= */

const dayImage =
  document.getElementById("day");

const nightImage =
  document.getElementById("night");

const constellation =
  document.getElementById("constellation");

const teaButton =
  document.getElementById("tea-button");

const teaMenu =
  document.getElementById("tea-menu");

const message =
  document.getElementById("message");

const main =
  document.getElementById("main");

const secret =
  document.getElementById("secret");


/* =========================
   낮 / 밤
========================= */

function updateDayNight() {

  const now =
    new Date();

  const hour =
    now.getHours();


  /*
    06:00 ~ 17:59
    낮

    18:00 ~ 05:59
    밤
  */

  const isDay =
    hour >= 6 &&
    hour < 18;


  if (isDay) {

    dayImage.style.opacity = "1";

    nightImage.style.opacity = "0";

  } else {

    dayImage.style.opacity = "0";

    nightImage.style.opacity = "1";

  }

}


/* 처음 실행 */

updateDayNight();


/* 1분마다 확인 */

setInterval(
  updateDayNight,
  60000
);


/* =========================
   별자리 이동
========================= */

constellation.addEventListener(
  "click",
  function() {

    window.location.href =
      "constellation/";

  }
);


/* =========================
   TEA 열기
========================= */

teaButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    teaMenu.classList.toggle(
      "open"
    );

  }
);


/* =========================
   TEA 선택
========================= */

document
  .querySelectorAll(".tea-item")
  .forEach(
    function(item) {

      item.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          const tea =
            item.dataset.tea;

          showMessage(
            tea +
            "를 선택했어요."
          );

          teaMenu.classList.remove(
            "open"
          );

        }
      );

    }
  );


/* =========================
   메뉴
========================= */

document
  .querySelectorAll(".menu-item")
  .forEach(
    function(item) {

      item.addEventListener(
        "click",
        function() {

          showMessage(
            item.dataset.message
          );

        }
      );

    }
  );


/* =========================
   SECRET
========================= */

secret.addEventListener(
  "click",
  function() {

    showMessage(
      "아직 아무도 발견하지 못한 곳이에요."
    );

  }
);


/* =========================
   화면 클릭
========================= */

main.addEventListener(
  "click",
  function(event) {

    if (
      event.target !== teaButton &&
      !teaMenu.contains(
        event.target
      )
    ) {

      teaMenu.classList.remove(
        "open"
      );

    }

  }
);


/* =========================
   메시지
========================= */

let messageTimer;


function showMessage(text) {

  message.textContent =
    text;

  message.classList.add(
    "show"
  );


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(
      function() {

        message.classList.remove(
          "show"
        );

      },
      1800
    );

}

</script>


</body>

</html>
