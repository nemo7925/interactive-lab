<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Interactive Lab</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        sans-serif;

      background: #050814;
      color: white;
    }


    /* =========================
       MAIN
    ========================= */

    #main {
      position: relative;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      touch-action: manipulation;
    }


    /* =========================
       NIGHT IMAGE
    ========================= */

    #night {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 0;

      user-select: none;
      pointer-events: none;
    }


    /* =========================
       DARK OVERLAY
    ========================= */

    #night::after {
      content: "";
    }


    /* =========================
       TITLE
    ========================= */

    #title {
      position: absolute;

      top: max(
        28px,
        env(safe-area-inset-top)
      );

      left: 50%;

      transform: translateX(-50%);

      text-align: center;

      z-index: 10;

      pointer-events: none;

      text-shadow:
        0 2px 20px rgba(0,0,0,0.5);
    }

    #title h1 {
      font-size: 22px;

      font-weight: 400;

      letter-spacing: 0.15em;
    }

    #title p {
      margin-top: 7px;

      font-size: 11px;

      opacity: 0.65;

      letter-spacing: 0.08em;
    }


    /* =========================
       CATEGORY MENU
    ========================= */

    #categories {
      position: absolute;

      left: 24px;

      bottom:
        calc(
          28px +
          env(safe-area-inset-bottom)
        );

      display: flex;

      flex-direction: column;

      gap: 10px;

      z-index: 20;
    }

    .category {
      border: none;

      background: none;

      color: white;

      font-size: 12px;

      letter-spacing: 0.15em;

      opacity: 0.65;

      cursor: pointer;

      text-align: left;

      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    .category:hover {
      opacity: 1;

      transform:
        translateX(5px);
    }


    /* =========================
       TEA BUTTON
    ========================= */

    #teaButton {

      position: absolute;

      right: 28px;

      bottom:
        calc(
          30px +
          env(safe-area-inset-bottom)
        );

      width: 58px;
      height: 58px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,0.35);

      background:
        rgba(255,255,255,0.12);

      color: white;

      backdrop-filter: blur(10px);

      cursor: pointer;

      z-index: 30;

      transition:
        transform 0.3s,
        background 0.3s;
    }

    #teaButton:hover {

      transform: scale(1.08);

      background:
        rgba(255,255,255,0.2);
    }

    #teaButton span {
      display: block;

      font-size: 20px;
    }

    #teaButton small {
      display: block;

      margin-top: 2px;

      font-size: 7px;

      letter-spacing: 0.1em;
    }


    /* =========================
       TEA MENU
    ========================= */

    #teaMenu {

      position: absolute;

      right: 25px;

      bottom:
        calc(
          100px +
          env(safe-area-inset-bottom)
        );

      width: 180px;

      padding: 18px;

      border:
        1px solid
        rgba(255,255,255,0.2);

      border-radius: 20px;

      background:
        rgba(10,15,30,0.75);

      backdrop-filter:
        blur(20px);

      z-index: 40;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(15px);

      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    #teaMenu.show {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateY(0);
    }

    #teaMenu h2 {

      font-size: 13px;

      font-weight: 400;

      letter-spacing: 0.15em;

      margin-bottom: 14px;
    }

    .tea {

      width: 100%;

      padding: 9px 0;

      border: none;

      background: none;

      color: white;

      text-align: left;

      font-size: 12px;

      opacity: 0.7;

      cursor: pointer;
    }

    .tea:hover {
      opacity: 1;
    }


    /* =========================
       CONSTELLATION
    ========================= */

    #constellation {

      position: absolute;

      top: 20%;

      left: 70%;

      width: 45px;
      height: 45px;

      border: none;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 8px white,
        0 0 20px
        rgba(150,200,255,0.9),
        0 0 40px
        rgba(100,160,255,0.6);

      cursor: pointer;

      z-index: 15;

      animation:
        starPulse 3s
        ease-in-out
        infinite;
    }

    @keyframes starPulse {

      0%,
      100% {
        transform: scale(0.8);

        opacity: 0.65;
      }

      50% {
        transform: scale(1);

        opacity: 1;
      }
    }


    /* =========================
       SECRET
    ========================= */

    #secret {

      position: absolute;

      left: 50%;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      border: none;

      background: none;

      color: white;

      font-size: 10px;

      letter-spacing: 0.2em;

      opacity: 0.35;

      cursor: pointer;

      z-index: 25;

      transition:
        opacity 0.3s;
    }

    #secret:hover {
      opacity: 1;
    }


    /* =========================
       MESSAGE
    ========================= */

    #message {

      position: absolute;

      top: 50%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      padding:
        14px 22px;

      border-radius: 30px;

      background:
        rgba(255,255,255,0.12);

      backdrop-filter:
        blur(15px);

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      z-index: 100;

      transition:
        opacity 0.5s;
    }

    #message.show {
      opacity: 1;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #title h1 {
        font-size: 18px;
      }

      #categories {
        left: 18px;
        bottom:
          calc(
            25px +
            env(safe-area-inset-bottom)
          );
      }

      #teaButton {
        right: 18px;
      }

      #constellation {

        top: 18%;

        left: 68%;

        width: 35px;
        height: 35px;
      }

    }

  </style>
</head>


<body>


  <main id="main">


    <!-- =====================
         BACKGROUND
    ====================== -->

    <img
      id="night"
      src="https://raw.githubusercontent.com/nemo7925/data-center/refs/heads/main/images/night-test.png"
      alt=""
    >


    <!-- =====================
         TITLE
    ====================== -->

    <div id="title">

      <h1>INTERACTIVE LAB</h1>

      <p>
        움직이는 그림과 이야기를 만드는 공간
      </p>

    </div>


    <!-- =====================
         CONSTELLATION STAR
    ====================== -->

    <button
      id="constellation"
      aria-label="나의 별자리"
    ></button>


    <!-- =====================
         CATEGORY
    ====================== -->

    <nav id="categories">

      <button
        class="category"
        data-message="REST"
      >
        REST
      </button>

      <button
        class="category"
        data-message="DREAM"
      >
        DREAM
      </button>

      <button
        class="category"
        data-message="STORY"
      >
        STORY
      </button>

      <button
        class="category"
        data-message="PLAY"
      >
        PLAY
      </button>

    </nav>


    <!-- =====================
         TEA
    ====================== -->

    <button
      id="teaButton"
      aria-label="Tea Menu"
    >

      <span>🍵</span>

      <small>TEA</small>

    </button>


    <!-- =====================
         TEA MENU
    ====================== -->

    <div id="teaMenu">

      <h2>TEA MENU</h2>

      <button
        class="tea"
        data-tea="GREEN"
      >
        Green Tea
      </button>

      <button
        class="tea"
        data-tea="ROSE"
      >
        Rose Tea
      </button>

      <button
        class="tea"
        data-tea="BLACK"
      >
        Black Tea
      </button>

      <button
        class="tea"
        data-tea="NIGHT"
      >
        Night Tea
      </button>

    </div>


    <!-- =====================
         SECRET
    ====================== -->

    <button id="secret">
      SECRET
    </button>


    <!-- =====================
         MESSAGE
    ====================== -->

    <div id="message"></div>


  </main>


  <script>


    /* =========================
       ELEMENTS
    ========================= */

    const teaButton =
      document.getElementById(
        "teaButton"
      );

    const teaMenu =
      document.getElementById(
        "teaMenu"
      );

    const constellation =
      document.getElementById(
        "constellation"
      );

    const secret =
      document.getElementById(
        "secret"
      );

    const message =
      document.getElementById(
        "message"
      );


    /* =========================
       TEA MENU
    ========================= */

    teaButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        teaMenu.classList.toggle(
          "show"
        );

      }
    );


    /* =========================
       TEA SELECT
    ========================= */

    document
      .querySelectorAll(".tea")
      .forEach(
        function(tea) {

          tea.addEventListener(
            "click",
            function() {

              const name =
                tea.dataset.tea;

              showMessage(
                name +
                " TEA를 선택했어요 ☕"
              );

              teaMenu.classList.remove(
                "show"
              );

            }
          );

        }
      );


    /* =========================
       CONSTELLATION
    ========================= */

    constellation.addEventListener(
      "click",
      function() {

        /*
          나의 별자리 페이지
        */

        window.location.href =
          "constellation/";

      }
    );


    /* =========================
       SECRET
    ========================= */

    secret.addEventListener(
      "click",
      function() {

        showMessage(
          "아직 아무도 발견하지 못한 곳이에요."
        );

      }
    );


    /* =========================
       CATEGORY
    ========================= */

    document
      .querySelectorAll(".category")
      .forEach(
        function(category) {

          category.addEventListener(
            "click",
            function() {

              showMessage(
                category.dataset.message
              );

            }
          );

        }
      );


    /* =========================
       MESSAGE
    ========================= */

    let messageTimer;

    function showMessage(text) {

      message.textContent =
        text;

      message.classList.add(
        "show"
      );

      clearTimeout(
        messageTimer
      );

      messageTimer =
        setTimeout(
          function() {

            message.classList.remove(
              "show"
            );

          },
          1800
        );

    }


    /* =========================
       CLOSE TEA
       OUTSIDE CLICK
    ========================= */

    document
      .getElementById("main")
      .addEventListener(
        "click",
        function(event) {

          if (
            !teaMenu.contains(
              event.target
            ) &&
            event.target !==
              teaButton
          ) {

            teaMenu.classList.remove(
              "show"
            );

          }

        }
      );


  </script>

</body>
</html>
